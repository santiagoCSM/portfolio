name: Generar portada Open Graph
on:
  push:
    paths:
      - 'img/og-cover.svg'
      - '.github/workflows/generate-og.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar renderizador SVG
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Crear PNG social
        run: rsvg-convert --width 1200 --height 630 --output img/og-cover.png img/og-cover.svg
      - name: Publicar PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/og-cover.png
          if ! git diff --cached --quiet; then
            git commit -m "Generar imagen OG 1200x630"
            git push
          fi
